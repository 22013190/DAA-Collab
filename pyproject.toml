[project]
name = "Multi-Agent_System"
version = "0.0.1"
description = "Natural Language to Dashboard//Report"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "a2a-sdk>=0.2.16",
  # Dashboard dependencies
  "aiomysql>=0.3.2",
  "fastapi>=0.104.0",
  "fastmcp>=2.10.5",
  "geopandas>=1.1.1",
  "httpx>=0.25.0",
  "langchain-anthropic>=0.3.18",
  "langchain-community>=0.3.25",
  "langchain-google-genai>=2.1.10",
  "langchain-mcp-adapters>=0.1.7",
  "langchain-openai>=0.3.28",
  "langchain>=0.3.25",  # If no other deps are used, consider to switch to langchain-core
  "langfuse>=3.2.2",
  "langgraph>=0.4.8",
  "llama-cpp-python>=0.3.16",
  "matplotlib>=3.10.6",
  "orjson>=3.11.3",
  "psycopg[binary,pool]>=3.2.9",
  "pydantic-settings>=2.10.1",
  "pydantic>=2.11.5",
  "pymysql>=1.1.2",
  "pytest-asyncio>=1.3.0",
  "pytest>=8.4.2",
  "python-dotenv>=1.0.0",
  "scikit-learn>=1.7.1",
  "scipy>=1.16.1",
  "seaborn>=0.13.2",
  "simple-py-logger",  # Custom
  "sqlalchemy[asyncio]>=2.0.41",
  "starlette>=0.47.1",
  "tabulate>=0.9.0",
  "transformers>=4.57.1",
  "uvicorn[standard]>=0.35.0",
  "websockets>=12.0",
]

[project.scripts]
dashboard = "client.start_dashboard:main"
db-agent = "src.agents.database.__main__:start_a2a_db_agent"
supervisor-agent = "src.agents.planner.__main__:main"

[project.optional-dependencies]
agent-utils = [
  "pillow>=11.3.0",
]
analysis-agent = [
  "google-genai>=1.29.0",
  "jinja2>=3.1.6",
  "langchain-google-genai>=2.1.9",
  "langchain-openai>=0.3.28",
  "matplotlib>=3.10.5",
  "numpy>=2.3.1",
  "pandas>=2.3.1",
  "reportlab>=4.4.3",
  "scikit-learn>=1.7.1",
  "scipy>=1.16.1",
  "seaborn>=0.13.2",
]

[dependency-groups]
dev = [
  "debugpy>=1.8.15",
  "pytest-asyncio>=1.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# packages = ["."]
packages = ["src", "src/mcp", "./packages"]

# Allows relative referencing for import paths
# But this duplicates the code into the site-packages
# [tool.hatch.build.targets.wheel.force-include]
# "src/structures/llms" = "llms"
# "src/structures/interfaces" = "interfaces"
# "src/structures/models" = "models"
# "src/structures/states" = "states"
# "src/mcp" = "mcp_servers"

# Build into binary
# Requirees Rust as using PyApp
# https://hatch.pypa.io/latest/plugins/builder/binary/
# [tool.hatch.build.targets.binary]

[tool.uv]
package = true

[tool.uv.sources]
simple-py-logger = { workspace = true }

[tool.uv.workspace]
members = [
  "packages/*",
]
exclude = []
